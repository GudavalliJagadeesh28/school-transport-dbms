services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: transport
      DB_PASSWORD: transport123
      DB_NAME: school_transport
      SECRET_KEY: ${SECRET_KEY:-change-me}
      SCHOOL_NAME: ${SCHOOL_NAME:-Greenfield Public School}
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
